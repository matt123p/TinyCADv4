inecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><rect x="290" y="217" rx="0" ry="0" width="10" height="26" style="fill:none;stroke:#000000;stroke-width:1"></rect> <ellipse cx="295" cy="230" rx="20" ry="20" style="fill:none;stroke:#000000;stroke-width:1"></ellipse> <path d="M327.5 257.5 L312.5 242.5" style="fill:none;stroke:#000000;stroke-width:1" stroke-linecap="round"></path> <path d="M312.5 242.5 L314.09099050000003 246.56586399999998 L316.56586400000003 244.09099049999998 L312.5 242.5 Z" style="fill:#000000;stroke:#000000;stroke-width:1" stroke-linecap="round"></path> <path d="M327.5 247.5 L312.5 232.5" style="fill:none;stroke:#000000;stroke-width:1" stroke-linecap="round"></path> <path d="M312.5 232.5 L314.09099050000003 236.56586399999998 L316.56586400000003 234.09099049999998 L312.5 232.5 Z" style="fill:#000000;stroke:#000000;stroke-width:1" stroke-linecap="round"></path> <g transform="translate( 239.2890625 229.85)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>LDR1</tspan></text></g> <path d="M85 215 L85 180" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path> <path d="M85 180 L165 180" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path> <path d="M205 180 L295 180" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path> <path d="M295 180 L295 210" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path> <path d="M295 250 L295 290" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path> <path d="M295 290 L85 290" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 237.66015625 168.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>OUT</tspan></text></g><rect x="235.66015625" y="178" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect><g transform="translate( 119.15 168.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>IN</tspan></text></g><rect x="117.15" y="178" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect><rect x="35" y="20" rx="0" ry="0" width="1130" height="63" style="fill:none;stroke:#32495f;stroke-width:0"></rect><g transform="translate(35 20)" style="pointer-events:none"><svg width="1130" height="63" overflow="hidden" data-markdown="true"><text x="3" y="19" fill="#142d43" font-family="Arial" font-size="16" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">G14 · Light-responsive sensor circuit</text></svg></g><rect x="735" y="105" rx="0" ry="0" width="430" height="635" style="fill:#f4f8fc;stroke:#b7c9dc;stroke-width:0"></rect><g transform="translate(735 105)" style="pointer-events:none"><svg width="430" height="635" overflow="hidden" data-markdown="true"><text x="3" y="18" fill="#142d43" font-family="Arial" font-size="15" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">A light-dependent input</text><text x="3" y="37.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">GCSE · ages 14–16</text><text x="3" y="56" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The LDR resistance falls as its declared illumination rises. The resistor </text><text x="3" y="70" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">position determines whether OUT rises or falls.</text><text x="3" y="91" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Your investigation</text><text x="3" y="109.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Change Illuminance and record OUT. Explain why distance from a real </text><text x="3" y="123.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">lamp requires separate calibration.</text><text x="3" y="144.5" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">This activity</text><text x="3" y="163" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Repeat the sensor exercise with light/dark resistance values. Define </text><text x="3" y="177" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">whether the output should rise or fall as illumination decreases. A </text><text x="3" y="191" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">complete automatic lamp switch needs an additional switching model; </text><text x="3" y="205" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">changing resistance alone does not implement a switching threshold.</text><text x="3" y="226" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Getting started</text><text x="3" y="244.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Open the Simulation tab and press Run. Select a source or component to</text><text x="3" y="258.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">see its values. Read the labelled signals, then change one quantity at a </text><text x="3" y="272.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">time. Equal net labels identify connected points.</text><text x="3" y="291" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Explain:</text><text x="52.765625" y="291" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre"> What changed, and why? Use your readings as evidence.</text><text x="3" y="309.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The model predicts electrical behaviour; it does not replace real practical </text><text x="3" y="323.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measurements.</text></svg></g><circle cx="85" cy="290" r="5" style="fill:#000000;stroke:none"></circle></svg>