<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"></rect><defs><filter id="dropshadow" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"></feGaussianBlur><feOffset dx="1" dy="1" result="offsetblur"></feOffset><feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter></defs><ellipse cx="85" cy="200" rx="10" ry="10" style="fill:none;stroke:#0078d4;stroke-width:1"></ellipse> <rect x="75" y="180" rx="0" ry="0" width="20" height="40" style="fill:none"></rect> <path d="M82 196.25 L88 196.25" style="fill:none;stroke:#0078d4;stroke-width:1" stroke-linecap="round"></path> <path d="M85 193.25 L85 199.25" style="fill:none;stroke:#0078d4;stroke-width:1" stroke-linecap="round"></path> <path d="M82 204.5 L88 204.5" style="fill:none;stroke:#0078d4;stroke-width:1" stroke-linecap="round"></path> <g transform="rotate(90 85,180)"><line x1="85" y1="180" x2="95" y2="180" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="85" y1="180" x2="95" y2="180" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><g transform="rotate(270 85,220)"><line x1="85" y1="220" x2="95" y2="220" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="85" y1="220" x2="95" y2="220" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><g transform="translate( 69 201.1)"><text x="1" y="10" fill="#000000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>V1</tspan></text></g> <path d="M85 220 L85 410" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform=""><line x1="85" y1="410" x2="85" y2="424" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></line><path d="M78 424 L93 424 M81.5 431 L89 431 M86.75 438 L83.25 438" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></path></g><g transform="rotate(90 275,180)"><line x1="275" y1="180" x2="282" y2="180" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="275" y1="180" x2="282" y2="180" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><g transform="rotate(270 275,220)"><line x1="275" y1="220" x2="282" y2="220" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="275" y1="220" x2="282" y2="220" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><rect x="270" y="187" rx="0" ry="0" width="10" height="26" style="fill:none;stroke:#000000;stroke-width:1"></rect> <g transform="translate( 225 159.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>R1</tspan></text></g><g transform="translate( 225 171.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>1k</tspan></text></g><g transform="rotate(90 500,180)"><line x1="500" y1="180" x2="507" y2="180" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="500" y1="180" x2="507" y2="180" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><g transform="rotate(270 500,220)"><line x1="500" y1="220" x2="507" y2="220" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="500" y1="220" x2="507" y2="220" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><rect x="495" y="187" rx="0" ry="0" width="10" height="26" style="fill:none;stroke:#000000;stroke-width:1"></rect> <g transform="translate( 450 159.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>R2</tspan></text></g><g transform="translate( 450 171.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>2k</tspan></text></g> <path d="M85 180 L275 180 L500 180" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path> <path d="M275 220 L275 410" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path> <path d="M500 220 L500 410 L85 410 L85 220" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 500 168.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>OUT</tspan></text></g><rect x="498" y="178" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect><rect x="35" y="20" rx="0" ry="0" width="1130" height="63" style="fill:none;stroke:#32495f;stroke-width:0.7"></rect><g transform="translate(35 20)" style="pointer-events:none"><svg width="1130" height="63" overflow="hidden" data-markdown="true"><text x="3" y="19" fill="#142d43" font-family="Arial" font-size="16" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">G10 · Branch current and voltage in parallel circuits</text></svg></g><rect x="735" y="105" rx="0" ry="0" width="430" height="635" style="fill:#f4f8fc;stroke:#b7c9dc;stroke-width:0.7"></rect><g transform="translate(735 105)" style="pointer-events:none"><svg width="430" height="635" overflow="hidden" data-markdown="true"><text x="3" y="18" fill="#142d43" font-family="Arial" font-size="15" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">More than one current path</text><text x="3" y="37.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">GCSE · ages 14–16</text><text x="3" y="56" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Parallel branches share the same pair of nodes, so they share the same </text><text x="3" y="70" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">voltage. The supply current is the sum of the branch currents.</text><text x="3" y="91" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Your investigation</text><text x="3" y="109.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Compare the branch currents. Increase one branch resistance and </text><text x="3" y="123.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">explain what happens to the total current.</text><text x="3" y="144.5" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">This activity</text><text x="3" y="163" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Use two unequal branch resistors. Measure both branch voltages, both </text><text x="3" y="177" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">currents and the supply current. Repeat with one branch open.</text><text x="3" y="198" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Getting started</text><text x="3" y="216.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Open the Simulation tab and press Run. Select a source or component to</text><text x="3" y="230.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">see its values. Read the labelled signals, then change one quantity at a </text><text x="3" y="244.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">time. Equal net labels identify connected points.</text><text x="3" y="263" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Explain:</text><text x="52.765625" y="263" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre"> What changed, and why? Use your readings as evidence.</text><text x="3" y="281.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The model predicts electrical behaviour; it does not replace real practical </text><text x="3" y="295.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measurements.</text></svg></g></svg>