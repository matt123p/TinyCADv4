roke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="385" y1="180" x2="392" y2="180" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><rect x="352" y="175" rx="0" ry="0" width="26" height="10" style="fill:none;stroke:#000000;stroke-width:1"></rect> <g transform="translate( 348 142.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>R2</tspan></text></g><g transform="translate( 348 154.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>1k</tspan></text></g> <path d="M230 180 L345 180" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 385 168.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>N1</tspan></text></g><rect x="383" y="178" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect><g transform=""><line x1="500" y1="180" x2="507" y2="180" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="500" y1="180" x2="507" y2="180" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><g transform="rotate(180 540,180)"><line x1="540" y1="180" x2="547" y2="180" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="540" y1="180" x2="547" y2="180" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><rect x="507" y="175" rx="0" ry="0" width="26" height="10" style="fill:none;stroke:#000000;stroke-width:1"></rect> <g transform="translate( 503 142.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>R3</tspan></text></g><g transform="translate( 503 154.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>2k</tspan></text></g> <path d="M385 180 L500 180" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path> <path d="M540 180 L650 180 L650 410 L85 410" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><rect x="35" y="20" rx="0" ry="0" width="1130" height="63" style="fill:none;stroke:#32495f;stroke-width:0.7"></rect><g transform="translate(35 20)" style="pointer-events:none"><svg width="1130" height="63" overflow="hidden" data-markdown="true"><text x="3" y="19" fill="#142d43" font-family="Arial" font-size="16" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">G02 · Equivalent resistance of series combinations</text></svg></g><rect x="735" y="105" rx="0" ry="0" width="430" height="635" style="fill:#f4f8fc;stroke:#b7c9dc;stroke-width:0.7"></rect><g transform="translate(735 105)" style="pointer-events:none"><svg width="430" height="635" overflow="hidden" data-markdown="true"><text x="3" y="18" fill="#142d43" font-family="Arial" font-size="15" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">One current, several resistors</text><text x="3" y="37.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">GCSE · ages 14–16</text><text x="3" y="56" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">In a series path the same current passes through every component. The </text><text x="3" y="70" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">voltage changes across each resistor add to the supply voltage.</text><text x="3" y="91" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Your investigation</text><text x="3" y="109.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Predict the current. Run the circuit, then change one resistance and </text><text x="3" y="123.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">check the prediction.</text><text x="3" y="144.5" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">This activity</text><text x="3" y="163" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Compare one, two and three resistors at a fixed supply. Record total </text><text x="3" y="177" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">current and calculate the equivalent resistance. Use separate saved </text><text x="3" y="191" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">circuits or a component-value study.</text><text x="3" y="212" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Getting started</text><text x="3" y="230.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Open the Simulation tab and press Run. Select a source or component to</text><text x="3" y="244.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">see its values. Read the labelled signals, then change one quantity at a </text><text x="3" y="258.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">time. Equal net labels identify connected points.</text><text x="3" y="277" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Explain:</text><text x="52.765625" y="277" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre"> What changed, and why? Use your readings as evidence.</text><text x="3" y="295.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The model predicts electrical behaviour; it does not replace real practical </text><text x="3" y="309.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measurements.</text></svg></g></svg>