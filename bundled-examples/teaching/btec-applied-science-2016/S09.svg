th d="M120 250 L120 230" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 116.39453125 282.6)"><text x="1" y="10" fill="#000000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>0</tspan></text></g><g transform=""><line x1="120" y1="250" x2="120" y2="264" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></line><path d="M113 264 L128 264 M116.5 271 L124 271 M121.75 278 L118.25 278" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></path></g><g transform="translate( 170.16015625 168.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>OUT</tspan></text></g><rect x="168.16015625" y="178" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect><rect x="35" y="20" rx="0" ry="0" width="1130" height="63" style="fill:none;stroke:#32495f;stroke-width:0"></rect><g transform="translate(35 20)" style="pointer-events:none"><svg width="1130" height="63" overflow="hidden" data-markdown="true"><text x="3" y="19" fill="#142d43" font-family="Arial" font-size="16" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">S09 · Peak and RMS readings</text></svg></g><rect x="735" y="105" rx="0" ry="0" width="430" height="635" style="fill:#f4f8fc;stroke:#b7c9dc;stroke-width:0"></rect><g transform="translate(735 105)" style="pointer-events:none"><svg width="430" height="635" overflow="hidden" data-markdown="true"><text x="3" y="18" fill="#142d43" font-family="Arial" font-size="15" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Reading a waveform</text><text x="3" y="37.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Post-16 · ages 16–19</text><text x="3" y="56" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The source changes smoothly between positive and negative values. Its </text><text x="3" y="70" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">peak value, peak-to-peak value and RMS value describe different </text><text x="3" y="84" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measurements.</text><text x="3" y="105" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Your investigation</text><text x="3" y="123.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Read the period and calculate the frequency. Compare the peaks with the</text><text x="3" y="137.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">expected RMS value of a sine wave.</text><text x="3" y="158.5" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">This activity</text><text x="3" y="177" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Use a low-voltage sine source, scope and AC meter. Compare readings </text><text x="3" y="191" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">over complete cycles and distinguish a source&#x27;s offset from its alternating </text><text x="3" y="205" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">component.</text><text x="3" y="226" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Getting started</text><text x="3" y="244.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Open the Simulation tab and press Run. Select a source or component to</text><text x="3" y="258.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">see its values. Read the labelled signals, then change one quantity at a </text><text x="3" y="272.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">time. Equal net labels identify connected points.</text><text x="3" y="291" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Explain:</text><text x="52.765625" y="291" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre"> Use an equation, a truth table or a state sequence to justify your</text><text x="3" y="305" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">prediction. Include units and discuss the model assumptions.</text><text x="3" y="323.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The model predicts electrical behaviour; it does not replace real practical </text><text x="3" y="337.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measurements.</text></svg></g><circle cx="120" cy="250" r="5" style="fill:#000000;stroke:none"></circle></svg>