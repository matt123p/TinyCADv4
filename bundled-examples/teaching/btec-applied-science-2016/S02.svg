le="stroke:#c04040"></g><g style="stroke-width:0.6"></g></g></g><g transform="rotate(270 575,280)"><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"></g><g style="stroke-width:0.6"></g></g></g><g transform="rotate(270 560,280)"><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"></g><g style="stroke-width:0.6"></g></g></g><g transform="translate( 640 146.1)"><text x="1" y="10" fill="#000000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>DMM1</tspan></text></g> <path d="M605 280 L605 315" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 605 303.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>OUT</tspan></text></g><rect x="603" y="313" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect> <path d="M575 280 L575 315" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform=""><line x1="575" y1="315" x2="575" y2="329" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></line><path d="M568 329 L583 329 M571.5 336 L579 336 M576.75 343 L573.25 343" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></path></g> <path d="M 556 276 L 564 284 M 564 276 L 556 284" style="fill:none;stroke:#000000;stroke-width:1" stroke-linecap="round"></path><rect x="35" y="20" rx="0" ry="0" width="1130" height="63" style="fill:none;stroke:#32495f;stroke-width:0.7"></rect><g transform="translate(35 20)" style="pointer-events:none"><svg width="1130" height="63" overflow="hidden" data-markdown="true"><text x="3" y="19" fill="#142d43" font-family="Arial" font-size="16" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">S02 · Meter positions and loading</text></svg></g><rect x="735" y="105" rx="0" ry="0" width="430" height="635" style="fill:#f4f8fc;stroke:#b7c9dc;stroke-width:0.7"></rect><g transform="translate(735 105)" style="pointer-events:none"><svg width="430" height="635" overflow="hidden" data-markdown="true"><text x="3" y="18" fill="#142d43" font-family="Arial" font-size="15" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">The measuring device is part of the circuit</text><text x="3" y="37.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Post-16 · ages 16–19</text><text x="3" y="56" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">A voltmeter takes a small current. A current meter adds a small series </text><text x="3" y="70" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">resistance. A high-resistance circuit makes these effects easier to see.</text><text x="3" y="91" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Your investigation</text><text x="3" y="109.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Compare the unloaded prediction with the measured circuit. Decide which</text><text x="3" y="123.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">instrument setting matters most.</text><text x="3" y="144.5" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">This activity</text><text x="3" y="163" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Compare a divider with different voltmeter input resistances and </text><text x="3" y="177" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">current-meter burdens. Document which quantity each connection </text><text x="3" y="191" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measures.</text><text x="3" y="212" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Getting started</text><text x="3" y="230.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Open the Simulation tab and press Run. Select a source or component to</text><text x="3" y="244.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">see its values. Read the labelled signals, then change one quantity at a </text><text x="3" y="258.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">time. Equal net labels identify connected points.</text><text x="3" y="277" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Explain:</text><text x="52.765625" y="277" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre"> Use an equation, a truth table or a state sequence to justify your</text><text x="3" y="291" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">prediction. Include units and discuss the model assumptions.</text><text x="3" y="309.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The model predicts electrical behaviour; it does not replace real practical </text><text x="3" y="323.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measurements.</text></svg></g></svg>