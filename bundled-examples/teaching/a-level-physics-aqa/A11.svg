ack;stroke-width:1"><g style="stroke:#c04040"><line x1="225" y1="250" x2="230" y2="250" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><path d="M220 250 L220 250 L190 230" style="fill:none;stroke:#000000;stroke-width:1" stroke-linecap="round"></path> <path d="M195.5 231 L190 230 L193 235 Z" style="fill:#000000;stroke:#000000;stroke-width:1" stroke-linecap="round"></path> <g transform="translate( 162.46484375 229.85)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>RV1</tspan></text></g><g transform="translate( 166.578125 242.35)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>10k</tspan></text></g> <path d="M205 220 L205 185" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 193.99 212.725390625) rotate( 270 0 0 )"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>VCC</tspan></text></g><rect x="203" y="183" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect> <path d="M205 260 L205 285" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 201.39453125 317.6)"><text x="1" y="10" fill="#000000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>0</tspan></text></g><g transform=""><line x1="205" y1="285" x2="205" y2="299" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></line><path d="M198 299 L213 299 M201.5 306 L209 306 M206.75 313 L203.25 313" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></path></g> <path d="M225 250 L255 250" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 227.66015625 238.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>OUT</tspan></text></g><rect x="225.66015625" y="248" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect><g transform="rotate(90 285,270)"><line x1="285" y1="270" x2="292" y2="270" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="285" y1="270" x2="292" y2="270" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><g transform="rotate(270 285,310)"><line x1="285" y1="310" x2="292" y2="310" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="285" y1="310" x2="292" y2="310" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><rect x="280" y="277" rx="0" ry="0" width="10" height="26" style="fill:none;stroke:#000000;stroke-width:1"></rect> <g transform="translate( 260.89453125 279.85)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>R1</tspan></text></g><g transform="translate( 256.578125 292.35)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>10k</tspan></text></g> <path d="M285 270 L285 235" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 273.99 262.6796875) rotate( 270 0 0 )"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>OUT</tspan></text></g><rect x="283" y="233" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect> <path d="M285 310 L285 335" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 281.39453125 367.6)"><text x="1" y="10" fill="#000000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>0</tspan></text></g><g transform=""><line x1="285" y1="335" x2="285" y2="349" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></line><path d="M278 349 L293 349 M281.5 356 L289 356 M286.75 363 L283.25 363" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></path></g><rect x="35" y="20" rx="0" ry="0" width="1130" height="63" style="fill:none;stroke:#32495f;stroke-width:0"></rect><g transform="translate(35 20)" style="pointer-events:none"><svg width="1130" height="63" overflow="hidden" data-markdown="true"><text x="3" y="19" fill="#142d43" font-family="Arial" font-size="16" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">A11 · Adjustable potential divider</text></svg></g><rect x="735" y="105" rx="0" ry="0" width="430" height="635" style="fill:#f4f8fc;stroke:#b7c9dc;stroke-width:0"></rect><g transform="translate(735 105)" style="pointer-events:none"><svg width="430" height="635" overflow="hidden" data-markdown="true"><text x="3" y="18" fill="#142d43" font-family="Arial" font-size="15" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Choose a fraction of a voltage</text><text x="3" y="37.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Post-16 · ages 16–19</text><text x="3" y="56" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The wiper selects a point along the resistance. A connected load can </text><text x="3" y="70" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">change the voltage it produces.</text><text x="3" y="91" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Your investigation</text><text x="3" y="109.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Change Wiper between 0 and 1. Compare the unloaded ratio with the </text><text x="3" y="123.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">loaded output.</text><text x="3" y="144.5" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">This activity</text><text x="3" y="163" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Use two resistors, or two resistor segments representing a potentiometer.</text><text x="3" y="177" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Vary the ratio and compare unloaded output with output connected to a </text><text x="3" y="191" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">finite load.</text><text x="3" y="212" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Getting started</text><text x="3" y="230.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Open the Simulation tab and press Run. Select a source or component to</text><text x="3" y="244.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">see its values. Read the labelled signals, then change one quantity at a </text><text x="3" y="258.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">time. Equal net labels identify connected points.</text><text x="3" y="277" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Explain:</text><text x="52.765625" y="277" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre"> Use an equation, a truth table or a state sequence to justify your</text><text x="3" y="291" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">prediction. Include units and discuss the model assumptions.</text><text x="3" y="309.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The model predicts electrical behaviour; it does not replace real practical </text><text x="3" y="323.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measurements.</text></svg></g></svg>