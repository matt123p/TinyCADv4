anslate( 289.18359375 221.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>200</tspan></text></g> <path d="M280 200 L240 200" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 244.4837890625 188.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>PACK</tspan></text></g><rect x="242.4837890625" y="198" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect> <path d="M320 200 L350 200" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 322.66015625 188.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>OUT</tspan></text></g><rect x="320.66015625" y="198" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect><g transform="rotate(90 410,180)"><line x1="410" y1="180" x2="417" y2="180" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="410" y1="180" x2="417" y2="180" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><g transform="rotate(270 410,220)"><line x1="410" y1="220" x2="417" y2="220" stroke-linecap="round"></line><g style="fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="410" y1="220" x2="417" y2="220" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><rect x="405" y="187" rx="0" ry="0" width="10" height="26" style="fill:none;stroke:#000000;stroke-width:1"></rect> <g transform="translate( 385.89453125 189.85)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>R2</tspan></text></g><g transform="translate( 380.8671875 202.35)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>100</tspan></text></g> <path d="M410 180 L410 145" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 398.99 172.6796875) rotate( 270 0 0 )"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>OUT</tspan></text></g><rect x="408" y="143" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect> <path d="M410 220 L410 245" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 406.39453125 277.6)"><text x="1" y="10" fill="#000000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>0</tspan></text></g><g transform=""><line x1="410" y1="245" x2="410" y2="259" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></line><path d="M403 259 L418 259 M406.5 266 L414 266 M411.75 273 L408.25 273" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></path></g><rect x="35" y="20" rx="0" ry="0" width="1130" height="63" style="fill:none;stroke:#32495f;stroke-width:0"></rect><g transform="translate(35 20)" style="pointer-events:none"><svg width="1130" height="63" overflow="hidden" data-markdown="true"><text x="3" y="19" fill="#142d43" font-family="Arial" font-size="16" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">A10 · Cells in series and identical cells in parallel</text></svg></g><rect x="735" y="105" rx="0" ry="0" width="430" height="635" style="fill:#f4f8fc;stroke:#b7c9dc;stroke-width:0"></rect><g transform="translate(735 105)" style="pointer-events:none"><svg width="430" height="635" overflow="hidden" data-markdown="true"><text x="3" y="18" fill="#142d43" font-family="Arial" font-size="15" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Two cells, one supply</text><text x="3" y="37.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Post-16 · ages 16–19</text><text x="3" y="56" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Each cell contributes an emf. In series the emfs add; real cells also add </text><text x="3" y="70" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">internal resistance. Identical cells in parallel share load current.</text><text x="3" y="91" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Your investigation</text><text x="3" y="109.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Predict the loaded voltage for the series pair. Build a separate parallel </text><text x="3" y="123.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">copy with a resistor in each cell branch, then compare under the same </text><text x="3" y="137.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">load.</text><text x="3" y="158.5" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">This activity</text><text x="3" y="177" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Include an internal resistance for each source. Compare terminal voltage </text><text x="3" y="191" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">and load current for the same load; avoid modelling parallel cells as </text><text x="3" y="205" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">contradictory ideal voltage sources.</text><text x="3" y="226" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Getting started</text><text x="3" y="244.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Open the Simulation tab and press Run. Select a source or component to</text><text x="3" y="258.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">see its values. Read the labelled signals, then change one quantity at a </text><text x="3" y="272.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">time. Equal net labels identify connected points.</text><text x="3" y="291" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Start with two 1.5 V cells in series. R1 = 200 ohms represents their </text><text x="3" y="305" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">combined internal resistance (100 ohms each). For the parallel </text><text x="3" y="319" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">comparison, give each cell its own 100-ohm series resistance before </text><text x="3" y="333" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">joining the terminals; never place different ideal source voltages directly in</text><text x="3" y="347" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">parallel.</text><text x="3" y="365.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Explain:</text><text x="52.765625" y="365.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre"> Use an equation, a truth table or a state sequence to justify your</text><text x="3" y="379.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">prediction. Include units and discuss the model assumptions.</text><text x="3" y="398" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The model predicts electrical behaviour; it does not replace real practical </text><text x="3" y="412" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measurements.</text></svg></g></svg>