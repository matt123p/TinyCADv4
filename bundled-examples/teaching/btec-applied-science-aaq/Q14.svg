"fill:none;stroke:black;stroke-width:1"><g style="stroke:#c04040"><line x1="550" y1="340" x2="557" y2="340" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><rect x="545" y="307" rx="0" ry="0" width="10" height="26" style="fill:none;stroke:#000000;stroke-width:1"></rect> <g transform="translate( 500 279.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>R1</tspan></text></g><g transform="translate( 500 291.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>100</tspan></text></g> <path d="M550 300 L550 275" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 550 263.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>MEASURE</tspan></text></g><rect x="548" y="273" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect> <path d="M550 340 L550 365" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 550 353.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>RETURN</tspan></text></g><rect x="548" y="363" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect><rect x="35" y="20" rx="0" ry="0" width="1130" height="63" style="fill:none;stroke:#32495f;stroke-width:0.7"></rect><g transform="translate(35 20)" style="pointer-events:none"><svg width="1130" height="63" overflow="hidden" data-markdown="true"><text x="3" y="19" fill="#142d43" font-family="Arial" font-size="16" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Q14 · Solar-cell optical investigation plan</text></svg></g><rect x="735" y="105" rx="0" ry="0" width="430" height="635" style="fill:#f4f8fc;stroke:#b7c9dc;stroke-width:0.7"></rect><g transform="translate(735 105)" style="pointer-events:none"><svg width="430" height="635" overflow="hidden" data-markdown="true"><text x="3" y="18" fill="#142d43" font-family="Arial" font-size="15" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Solar-cell optical investigation plan</text><text x="3" y="37.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Post-16 · ages 16–19</text><text x="3" y="56" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Annotate the circuit, test conditions and data-recording points for changes</text><text x="3" y="70" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">in distance, angle and illumination. The spatial/optical arrangement </text><text x="3" y="84" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">remains a separate apparatus sketch; TinyCAD does not calculate it from </text><text x="3" y="98" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">a schematic.</text><text x="3" y="119" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Your investigation</text><text x="3" y="137.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Record a prediction, follow the stated task and compare the result with </text><text x="3" y="151.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">your prediction.</text><text x="3" y="172.5" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">This activity</text><text x="3" y="191" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Annotate the circuit, test conditions and data-recording points for changes</text><text x="3" y="205" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">in distance, angle and illumination. The spatial/optical arrangement </text><text x="3" y="219" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">remains a separate apparatus sketch; TinyCAD does not calculate it from </text><text x="3" y="233" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">a schematic.</text><text x="3" y="254" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Getting started</text><text x="3" y="272.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">This is a connection-planning drawing. Follow each labelled net, identify </text><text x="3" y="286.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">the real terminals and add your bench measurements. No simulation is </text><text x="3" y="300.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">attached.</text><text x="3" y="319" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Explain:</text><text x="52.765625" y="319" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre"> Use an equation, a truth table or a state sequence to justify your</text><text x="3" y="333" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">prediction. Include units and discuss the model assumptions.</text><text x="3" y="351.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Check the physical layout with your teacher before construction.</text></svg></g></svg>