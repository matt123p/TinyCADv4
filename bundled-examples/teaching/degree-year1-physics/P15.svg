oke-width:1"><g style="stroke:#c04040"><line x1="625" y1="400" x2="632" y2="400" stroke-linecap="round"></line></g><g style="stroke-width:0.6"></g></g></g><rect x="620" y="367" rx="0" ry="0" width="10" height="26" style="fill:none;stroke:#000000;stroke-width:1"></rect> <g transform="translate( 575 339.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>R1</tspan></text></g><g transform="translate( 575 351.1)"><text x="1" y="10" fill="#FF0000" style="pointer-events:none;font-size:10px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>10k</tspan></text></g> <path d="M625 360 L625 335" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform="translate( 625 323.99)"><text x="1" y="9" fill="#142d43" style="pointer-events:none;font-size:9px;font-family:Arial;font-weight:normal;font-style:normal;white-space:pre"><tspan>OUT</tspan></text></g><rect x="623" y="333" width="4" height="4" style="stroke:red;stroke-width:1;fill:none"></rect> <path d="M625 400 L625 425" style="fill:none;stroke:#0000ff;stroke-width:1" stroke-linecap="round"></path><g transform=""><line x1="625" y1="425" x2="625" y2="439" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></line><path d="M618 439 L633 439 M621.5 446 L629 446 M626.75 453 L623.25 453" style="fill:none;stroke:#000000;stroke-width:1;stroke-linecap:round"></path></g><rect x="35" y="20" rx="0" ry="0" width="1130" height="63" style="fill:none;stroke:#32495f;stroke-width:0.7"></rect><g transform="translate(35 20)" style="pointer-events:none"><svg width="1130" height="63" overflow="hidden" data-markdown="true"><text x="3" y="19" fill="#142d43" font-family="Arial" font-size="16" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">P15 · Threshold detector and logic output</text></svg></g><rect x="735" y="105" rx="0" ry="0" width="430" height="635" style="fill:#f4f8fc;stroke:#b7c9dc;stroke-width:0.7"></rect><g transform="translate(735 105)" style="pointer-events:none"><svg width="430" height="635" overflow="hidden" data-markdown="true"><text x="3" y="18" fill="#142d43" font-family="Arial" font-size="15" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Compare two voltages</text><text x="3" y="37.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">First-year degree · ages 18+</text><text x="3" y="56" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The comparator output changes state according to which input voltage is </text><text x="3" y="70" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">greater. Its output is limited by its supply rails.</text><text x="3" y="91" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Your investigation</text><text x="3" y="109.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Predict the switching points. Change the reference and compare the input</text><text x="3" y="123.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">and output traces.</text><text x="3" y="144.5" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">This activity</text><text x="3" y="163" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Apply a slow input and a reference to a comparator, then check the </text><text x="3" y="177" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">resulting logic levels. The model must represent the required output limits.</text><text x="3" y="198" fill="#142d43" font-family="Arial" font-size="12.5" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Getting started</text><text x="3" y="216.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">Open the Simulation tab and press Run. Select a source or component to</text><text x="3" y="230.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">see its values. Read the labelled signals, then change one quantity at a </text><text x="3" y="244.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">time. Equal net labels identify connected points.</text><text x="3" y="263" fill="#142d43" font-family="Arial" font-size="10" font-weight="bold" font-style="normal" xml:space="preserve" style="white-space:pre">Explain:</text><text x="52.765625" y="263" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre"> Use an equation, a truth table or a state sequence to justify your</text><text x="3" y="277" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">prediction. Include units and discuss the model assumptions.</text><text x="3" y="295.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">The model predicts electrical behaviour; it does not replace real practical </text><text x="3" y="309.5" fill="#142d43" font-family="Arial" font-size="10" font-weight="normal" font-style="normal" xml:space="preserve" style="white-space:pre">measurements.</text></svg></g></svg>