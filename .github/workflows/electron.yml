name: Desktop Build

on:
  push:
    branches:
      - main
      - production
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-linux:
    name: Build on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run dist
        env:
          # GitHub token is required for releasing
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}

      - name: Upload Artifacts
        if: github.ref == 'refs/heads/production'
        uses: actions/upload-artifact@v6
        with:
          name: tinycad-ubuntu-latest
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.deb
            release/*.snap
          if-no-files-found: warn

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App
        if: runner.os != 'macOS'
        run: npm run dist
        env:
          # GitHub token is required for releasing
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}

      - name: Build unsigned macOS app for pull requests
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        run: npm run dist -- --mac -c.mac.identity=null -c.mac.notarize=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build signed and notarized macOS app
        if: runner.os == 'macOS' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required macOS signing credential: $key"
              exit 1
            fi
          done
          # Import explicitly: electron-builder 26.8.2 uses the certificate password
          # instead of its generated keychain password for set-key-partition-list.
          certificate_path="$RUNNER_TEMP/signing-certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          trap 'security delete-keychain "$keychain_path" >/dev/null 2>&1 || true; rm -f "$certificate_path"' EXIT
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.CSC_LINK, "base64"))' "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          export CSC_KEYCHAIN="$keychain_path"
          unset CSC_LINK CSC_KEY_PASSWORD
          npm run dist -- --mac -c.mac.forceCodeSigning=true -c.mac.notarize=true
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/TinyCAD.app
          xcrun stapler validate release/mac-arm64/TinyCAD.app

      - name: Upload Artifacts
        if: github.ref == 'refs/heads/production'
        uses: actions/upload-artifact@v6
        with:
          name: tinycad-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.deb
            release/*.snap
          if-no-files-found: warn

  release:
    name: Tag and Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [build-linux, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: version
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          tag="v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download Release Artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: tinycad-*
          path: release-assets
          merge-multiple: true

      - name: Create or Validate Git Tag
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          existing_commit=$(git rev-list -n 1 "$tag" 2>/dev/null || true)

          if [ -n "$existing_commit" ]; then
            if [ "$existing_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists at $existing_commit and will not be moved to $GITHUB_SHA."
              exit 1
            fi

            echo "Tag $tag already points at $GITHUB_SHA."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          title="TinyCAD ${{ steps.version.outputs.version }}"
          mapfile -t files < <(find release-assets -type f | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$title" --generate-notes --target "$GITHUB_SHA"
          fi
