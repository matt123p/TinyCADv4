name: Publish to Stores

on:
  workflow_call:
    inputs:
      publish_snap:
        description: 'Publish to Snap Store'
        default: false
        type: boolean
      publish_ms_store:
        description: 'Publish to Microsoft Store'
        default: false
        type: boolean
    secrets:
      APPX_PUBLISHER:
        required: false
      PARTNER_CENTER_TENANT_ID:
        required: false
      PARTNER_CENTER_SELLER_ID:
        required: false
      PARTNER_CENTER_CLIENT_ID:
        required: false
      PARTNER_CENTER_CLIENT_SECRET:
        required: false
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false
  workflow_dispatch:
    inputs:
      publish_snap:
        description: 'Publish to Snap Store'
        required: false
        default: false
        type: boolean
      publish_ms_store:
        description: 'Publish to Microsoft Store'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  engines:
    uses: ./.github/workflows/ngspice.yml
  publish-snap:
    needs: engines
    if: inputs.publish_snap == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Snapcraft for the Ubuntu 24 runtime
        run: sudo snap install snapcraft --classic

      - name: Install Dependencies
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: ngspice-*
          path: build/engine-artifacts
      - run: node scripts/stage-engine-artifacts.mjs


      - name: Build Snap
        run: npm run dist -- --linux snap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}

      - name: Locate Snap Artifact
        id: snap_artifact
        shell: bash
        run: |
          snap_file=$(find release -maxdepth 1 -type f -name '*.snap' | head -n 1)
          if [ -z "$snap_file" ]; then
            echo "No .snap file found in release/"
            exit 1
          fi

          echo "Using snap artifact: $snap_file"
          echo "path=$snap_file" >> "$GITHUB_OUTPUT"

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap_artifact.outputs.path }}
          release: stable

  publish-ms-store:
    needs: engines
    concurrency:
      group: microsoft-store-submission
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.publish_ms_store == true
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Validate Store Product ID
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MICROSOFT_STORE_APP_ID)) {
            throw "Set the repository Actions variable MICROSOFT_STORE_APP_ID to TinyCAD's Store ID from Product identity."
          }
        env:
          MICROSOFT_STORE_APP_ID: ${{ vars.MICROSOFT_STORE_APP_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: ngspice-*
          path: build/engine-artifacts
      - run: node scripts/stage-engine-artifacts.mjs


      - name: Build AppX/MSIX
        # Force build of AppX/MSIX package
        run: npm run dist -- --win appx --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.2

      - name: Configure Microsoft Store CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "$env:PARTNER_CENTER_TENANT_ID" `
            --sellerId "$env:PARTNER_CENTER_SELLER_ID" `
            --clientId "$env:PARTNER_CENTER_CLIENT_ID" `
            --clientSecret "$env:PARTNER_CENTER_CLIENT_SECRET"
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Publish to Microsoft Store
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path release/* -File -Include *.appx, *.msix, *.appxupload, *.msixupload)
          if ($packages.Count -eq 0) {
            throw "No AppX or MSIX packages found in release folder."
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          foreach ($arch in @('x64', 'arm64')) {
            $expectedName = "TinyCAD Windows Setup $version-$arch.appx"
            if (@($packages | Where-Object { $_.Name -eq $expectedName }).Count -ne 1) {
              throw "Missing required Store package: $expectedName"
            }
          }
          if ($packages.Count -ne 2) {
            throw "Expected exactly two current-version Store packages; found $($packages.Count)."
          }
          Write-Host "Publishing $($packages.Count) package(s) from release/..."
          msstore publish . --inputDirectory release --appId "$env:MICROSOFT_STORE_APP_ID" --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          MICROSOFT_STORE_APP_ID: ${{ vars.MICROSOFT_STORE_APP_ID }}
