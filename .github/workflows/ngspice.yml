name: Qualify ngspice engines
on:
  # Desktop Build qualifies all engines on pushes and pull requests.
  # Keep this entry point for explicit qualification and reusable callers.
  workflow_dispatch:
  workflow_call:
    inputs:
      wasm_only:
        description: 'Only qualify WASM for browser builds'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Cache compiled outputs by locked source, host and build scripts. The
      # emsdk is pinned; hosted runner image rollouts do not change the WASM ABI.
      # Bump the recipe version in these keys when workflow build flags change.
      # Always qualify restored binaries before uploading or saving them.
      - name: Restore WASM engine cache
        id: engine-cache
        uses: actions/cache/restore@v5
        with:
          path: public/engines/ngspice
          key: ngspice-v2-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build-support/ngspice/**', 'native/ngspice-host/**', 'scripts/build-ngspice.py', 'scripts/install-emsdk.py') }}
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows' && steps.engine-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: python3 scripts/install-emsdk.py
        if: steps.engine-cache.outputs.cache-hit != 'true'
      - name: Build WASM engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source build/toolchains/emsdk-4.0.23/emsdk_env.sh
          npm run engine:wasm
      - name: Qualify WASM numerical results
        run: node scripts/tests/qualify-engines.mjs wasm
      - run: npm run test:simulation
      # Save only after qualification; PRs consume the default branch cache.
      - name: Save qualified WASM engine cache
        if: steps.engine-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: public/engines/ngspice
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v6
        with:
          name: ngspice-wasm
          path: public/engines/ngspice
          if-no-files-found: error
  native:
    if: inputs.wasm_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-2025
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The runner OS release and CPU select the runtime ABI. Image patch
      # versions can coexist in one run and must not fragment this cache.
      - name: Restore native engine cache
        id: engine-cache
        uses: actions/cache/restore@v5
        with:
          path: build/engines/native
          key: ngspice-v2-native-${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('build-support/ngspice/**', 'native/ngspice-host/**', 'scripts/build-ngspice.py') }}
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows' && steps.engine-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
      # Parcel's LMDB 2.8 dependency has no Windows ARM64 prebuild. Engine
      # qualification uses esbuild and the native helper, not Parcel/Electron.
      - name: Install engine-test dependencies on Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm rebuild esbuild
      - run: npm run typecheck
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.engine-cache.outputs.cache-hit != 'true'
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'UCRT64' }}
          update: true
          install: >-
            make patch tar
            ${{ matrix.arch == 'arm64' && 'mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-python' || 'mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python' }}
      - name: Build native engine (Unix)
        if: runner.os != 'Windows' && steps.engine-cache.outputs.cache-hit != 'true'
        run: npm run engine:native
      - name: Build native engine (Windows)
        if: runner.os == 'Windows' && steps.engine-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          export CC=${{ matrix.arch == 'arm64' && 'clang' || 'gcc' }}
          export CXX=${{ matrix.arch == 'arm64' && 'clang++' || 'g++' }}
          python3 scripts/build-ngspice.py native
      - name: Qualify native numerical results
        run: node scripts/tests/qualify-engines.mjs native
      - run: npm run test:simulation
      - name: Save qualified native engine cache
        if: steps.engine-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: build/engines/native
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v6
        with:
          name: ngspice-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/engines/native
          if-no-files-found: error
