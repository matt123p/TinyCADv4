name: Qualify ngspice engines
on:
  pull_request:
  push:
    branches: [main, production]
  workflow_call:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/install-emsdk.py
      - name: Build and numerically qualify WASM
        shell: bash
        run: |
          source build/toolchains/emsdk-4.0.23/emsdk_env.sh
          npm run engine:wasm
          node scripts/tests/qualify-engines.mjs wasm
          npm run test:simulation
      - uses: actions/upload-artifact@v6
        with:
          name: ngspice-wasm
          path: public/engines/ngspice
          if-no-files-found: error
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: windows-2025
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'UCRT64' }}
          update: true
          install: >-
            make patch tar
            ${{ matrix.arch == 'arm64' && 'mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-python' || 'mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python' }}
      - name: Build native engine (Unix)
        if: runner.os != 'Windows'
        run: npm run engine:native
      - name: Build native engine (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export CC=${{ matrix.arch == 'arm64' && 'clang' || 'gcc' }}
          export CXX=${{ matrix.arch == 'arm64' && 'clang++' || 'g++' }}
          python3 scripts/build-ngspice.py native
      - name: Qualify native numerical results
        run: node scripts/tests/qualify-engines.mjs native
      - run: npm run test:simulation
      - uses: actions/upload-artifact@v6
        with:
          name: ngspice-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/engines/native
          if-no-files-found: error
